<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Risk Calculator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f3f3;font-family:Arial}
.wrap{max-width:430px;margin:10px auto;background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
h2{text-align:center;margin:6px 0 12px}
input{width:100%;padding:10px;font-size:16px;margin:5px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border-radius:10px;padding:8px}
.buy{background:#e8f8ec}.sell{background:#fdeaea}
.row{display:flex;justify-content:space-between;padding:3px 0}
.row b{font-size:15px}
</style>
</head>
<body>
<div class="wrap">
<h2>Risk Calculator</h2>

<input id="risk" type="number" value="3000" placeholder="Risk Amount">
<input id="rr" type="number" value="2" step="0.1" placeholder="Editable RR">
<input id="high" type="number" placeholder="Signal High">
<input id="low" type="number" placeholder="Signal Low">

<div class="grid">
<div class="card buy">
<h3>BUY</h3>
<div class="row"><span>Entry</span><b id="be">-</b></div>
<div class="row"><span>SL</span><b id="bs">-</b></div>
<div class="row"><span>Qty</span><b id="bq">-</b></div>
<div class="row"><span>T1 (1.5R)</span><b id="bt1">-</b></div>
<div class="row"><span>T2 (RR)</span><b id="bt2">-</b></div>
</div>

<div class="card sell">
<h3>SELL</h3>
<div class="row"><span>Entry</span><b id="se">-</b></div>
<div class="row"><span>SL</span><b id="ss">-</b></div>
<div class="row"><span>Qty</span><b id="sq">-</b></div>
<div class="row"><span>T1 (1.5R)</span><b id="st1">-</b></div>
<div class="row"><span>T2 (RR)</span><b id="st2">-</b></div>
</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
function put(id,v){$(id).textContent=v;}
["risk","rr","high","low"].forEach(id=>$(id).addEventListener("input",calc));

function calc(){
 const risk=parseFloat($("risk").value)||3000;
 const rr=parseFloat($("rr").value)||2;
 const high=parseFloat($("high").value);
 const low=parseFloat($("low").value);

 if(isNaN(high)||isNaN(low)||high<=low){
   ["be","bs","bq","bt1","bt2","se","ss","sq","st1","st2"].forEach(i=>put(i,"-"));
   return;
 }

 const buyEntry=high*1.001;
 const buySL=low*0.999;
 const buyRisk=buyEntry-buySL;
 const buyQty=Math.max(0,Math.floor(risk/buyRisk));
 const buyT1=buyEntry+buyRisk*1.5;
 const buyT2=buyEntry+buyRisk*rr;

 const sellEntry=low*0.999;
 const sellSL=high*1.001;
 const sellRisk=sellSL-sellEntry;
 const sellQty=Math.max(0,Math.floor(risk/sellRisk));
 const sellT1=sellEntry-sellRisk*1.5;
 const sellT2=sellEntry-sellRisk*rr;

 put("be",buyEntry.toFixed(2));
 put("bs",buySL.toFixed(2));
 put("bq",buyQty);
 put("bt1",buyT1.toFixed(2));
 put("bt2",buyT2.toFixed(2));

 put("se",sellEntry.toFixed(2));
 put("ss",sellSL.toFixed(2));
 put("sq",sellQty);
 put("st1",sellT1.toFixed(2));
 put("st2",sellT2.toFixed(2));
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Risk Calculator</title>
<style>
body{font-family:Arial;background:#f2f2f2;padding:20px}
.card{max-width:420px;margin:auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
h2{text-align:center}
input,select,button{width:100%;padding:12px;margin:10px 0;font-size:18px;box-sizing:border-box}
button{background:#0a7cff;color:#fff;border:none;border-radius:8px;font-weight:bold}
#out{margin-top:15px;padding:12px;border:1px solid #ddd;border-radius:8px;background:#fafafa}
.big{font-size:28px;font-weight:bold;color:green}
.blue{font-size:20px;font-weight:bold;color:#005bbb}
</style>
</head>
<body>
<div class="card">
<h2>₹ Risk Calculator</h2>

<input id="risk" type="number" value="2000" placeholder="Risk Amount">
<select id="type">
<option value="buy">BUY</option>
<option value="sell">SELL</option>
</select>
<input id="rr" type="number" step="0.1" value="1.5" placeholder="Target RR">
<input id="high" type="number" placeholder="Signal Candle High">
<input id="low" type="number" placeholder="Signal Candle Low">

<button onclick="calc()">CALCULATE</button>
<button onclick="resetAll()">RESET</button>

<div id="out"></div>
</div>

<script>
function calc(){
let risk=parseFloat(riskEl.value);
let high=parseFloat(highEl.value);
let low=parseFloat(lowEl.value);
let rr=parseFloat(rrEl.value)||1.5;
let type=typeEl.value;

if(isNaN(high)||isNaN(low)||high<=low){alert("High/Low sahi bharo");return;}

let rps=high-low;
let qty=Math.floor(risk/rps);
let entry,sl,t1,t2;

if(type==="buy"){
 entry=high; sl=low;
 t1=entry+rps;
 t2=entry+rps*rr;
}else{
 entry=low; sl=high;
 t1=entry-rps;
 t2=entry-rps*rr;
}

out.innerHTML=`
<div class="big">QTY : ${qty}</div><br>
<div class="big">1:1 TARGET : ${t1.toFixed(2)}</div><br>
<div class="big">1:${rr} TARGET : ${t2.toFixed(2)}</div><hr>
<div class="blue">${type==="buy"?"BUY":"SELL"} ENTRY : ${entry.toFixed(2)}</div>
<div class="blue">STOP LOSS : ${sl.toFixed(2)}</div>
<div>Risk / Share : ${rps.toFixed(2)}</div>
<div>Risk Amount : ₹${risk.toFixed(0)}</div>
<div>Profit @1:1 : ₹${(qty*rps).toFixed(0)}</div>
<div>Profit @1:${rr} : ₹${(qty*rps*rr).toFixed(0)}</div>`;
}
function resetAll(){
riskEl.value=2000;
rrEl.value=1.5;
highEl.value="";
lowEl.value="";
typeEl.value="buy";
out.innerHTML="";
}
const riskEl=document.getElementById("risk");
const highEl=document.getElementById("high");
const lowEl=document.getElementById("low");
const rrEl=document.getElementById("rr");
const typeEl=document.getElementById("type");
const out=document.getElementById("out");
</script>
</body>
</html>

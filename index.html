<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Risk Calculator</title>
<style>
body{font-family:Arial;margin:0;background:#f2f2f2}
.card{max-width:430px;margin:10px auto;padding:12px;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
h2{text-align:center;margin:6px 0 10px}
input{width:100%;padding:10px;margin:5px 0;font-size:16px;box-sizing:border-box}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box{padding:8px;border-radius:8px}
.buy{background:#e9f9ee}
.sell{background:#fdecec}
h3{text-align:center;margin:4px 0}
.row{display:flex;justify-content:space-between;padding:2px 0;font-size:14px}
b{font-size:15px}
</style>
</head>
<body>
<div class="card">
<h2>Risk Calculator</h2>

<input id="risk" type="number" value="3000" placeholder="Risk Amount" oninput="calc()">
<input id="rr" type="number" value="2" step="0.1" placeholder="Editable RR" oninput="calc()">
<input id="high" type="number" placeholder="High" oninput="calc()">
<input id="low" type="number" placeholder="Low" oninput="calc()">

<div class="grid">
<div class="box buy">
<h3>BUY</h3>
<div class="row"><span>Entry</span><b id="be">-</b></div>
<div class="row"><span>SL</span><b id="bs">-</b></div>
<div class="row"><span>Qty</span><b id="bq">-</b></div>
<div class="row"><span>T1 (1.5R)</span><b id="bt1">-</b></div>
<div class="row"><span>T2 (RR)</span><b id="bt2">-</b></div>
</div>

<div class="box sell">
<h3>SELL</h3>
<div class="row"><span>Entry</span><b id="se">-</b></div>
<div class="row"><span>SL</span><b id="ss">-</b></div>
<div class="row"><span>Qty</span><b id="sq">-</b></div>
<div class="row"><span>T1 (1.5R)</span><b id="st1">-</b></div>
<div class="row"><span>T2 (RR)</span><b id="st2">-</b></div>
</div>
</div>
</div>

<script>
function f(id,v){document.getElementById(id).textContent=v;}
function calc(){
let risk=parseFloat(risk.value)||3000;
let rr=parseFloat(document.getElementById("rr").value)||2;
let h=parseFloat(high.value);
let l=parseFloat(low.value);
if(isNaN(h)||isNaN(l)||h<=l)return;

let be=h*1.001;
let bs=l*0.999;
let br=be-bs;
let bq=Math.floor(risk/br);
let bt1=be+br*1.5;
let bt2=be+br*rr;

let se=l*0.999;
let ss=h*1.001;
let sr=ss-se;
let sq=Math.floor(risk/sr);
let st1=se-sr*1.5;
let st2=se-sr*rr;

f("be",be.toFixed(2));
f("bs",bs.toFixed(2));
f("bq",bq);
f("bt1",bt1.toFixed(2));
f("bt2",bt2.toFixed(2));

f("se",se.toFixed(2));
f("ss",ss.toFixed(2));
f("sq",sq);
f("st1",st1.toFixed(2));
f("st2",st2.toFixed(2));
}
</script>
</body>
</html>
